<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarktRadar</title>
<style>
  :root {
    --gruen: #3dff9a;
    --rot: #ff8b98;
    --gelb: #ffc14d;
    --ruhig: #8fb9a4;
    --text: #e9fff4;
    --linie: rgba(61, 255, 154, .22);
    --karte: rgba(6, 22, 16, .92);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.4 "Avenir Next", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #12382a, #07140f 55%);
  }
  button, input { font: inherit; color: inherit; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--linie);
  }
  h1 { margin: 0; font-size: 13px; letter-spacing: .16em; color: var(--gruen); }
  .werkzeuge { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  input[type="search"], input[type="text"] {
    background: rgba(5, 16, 12, .85); border: 1px solid rgba(61, 255, 154, .4);
    border-radius: 999px; padding: 7px 12px; min-width: 0;
  }
  header button, .filter button, .nav button {
    background: transparent; border: 1px solid var(--linie); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  header button.aktiv, .filter button.aktiv, .nav button.aktiv { background: rgba(61, 255, 154, .2); }
  .app { display: grid; grid-template-columns: 196px 1fr; height: calc(100% - 58px); }
  .nav { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-right: 1px solid var(--linie); }
  .nav button { text-align: left; border-radius: 12px; padding: 10px 12px; }
  .nav .status { margin-top: auto; color: var(--ruhig); font-size: 12px; }
  main { overflow: auto; padding: 18px 22px 32px; }
  .kpi-reihe, .raster { display: grid; gap: 12px; }
  .kpi-reihe { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 16px; }
  .raster { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .kpi, .karte, .diagramm, .panel {
    background: var(--karte); border: 1px solid var(--linie); border-radius: 16px; padding: 14px;
  }
  .kpi { text-align: left; cursor: pointer; }
  .kpi span, .karte .meta, .diagramm p, .ruhig { color: var(--ruhig); font-size: 12px; }
  .kpi strong, .preis { display: block; margin-top: 6px; font-size: 28px; letter-spacing: -.03em; }
  .preis { font-size: 22px; }
  .plus, .karte.hoch .preis { color: var(--gruen); }
  .minus, .karte.runter .preis { color: var(--rot); }
  .warn { color: var(--gelb); }
  .karte { cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 168px; }
  .karte h2, .diagramm h2, .panel h2 { margin: 0; font-size: 16px; }
  .symbol { color: var(--ruhig); font-size: 12px; letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 2px 8px; font-size: 11px; border: 1px solid var(--linie); }
  .chip.warn { border-color: rgba(255, 193, 77, .5); }
  .chip.plus { border-color: rgba(61, 255, 154, .45); color: var(--gruen); }
  .chip.minus { border-color: rgba(255, 139, 152, .45); color: var(--rot); }
  svg.spark, svg.linie { width: 100%; height: 42px; display: block; }
  svg.linie { height: 180px; }
  .filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .zwei { display: grid; grid-template-columns: 1.4fr .8fr; gap: 12px; margin-top: 12px; }
  .balken { height: 8px; border-radius: 999px; background: rgba(233, 255, 244, .08); overflow: hidden; }
  .balken span { display: block; height: 100%; background: var(--gruen); }
  .zeile { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--gruen); }
  .leer { color: var(--ruhig); }
  #treffer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #treffer button { border-radius: 999px; }
  @media (max-width: 1100px) {
    .kpi-reihe { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .zwei { grid-template-columns: 1fr; }
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .nav { flex-direction: row; overflow: auto; border-right: 0; border-bottom: 1px solid var(--linie); }
    .nav .status { display: none; }
    .kpi-reihe { grid-template-columns: 1fr 1fr; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1>MARKTRADAR</h1>
  <div class="werkzeuge">
    <input id="suche" type="search" placeholder="Suchen" aria-label="Suchen">
    <button id="finden" type="button">Kürzel suchen</button>
    <button id="neu" type="button">Aktualisieren</button>
    <span id="uhr"></span>
  </div>
</header>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main id="inhalt"></main>
</div>
<div id="treffer"></div>
<script>
const SVG = "http://www.w3.org/2000/svg";
const NAV = [
  ["dashboard", "Dashboard"],
  ["aktien", "Aktien"],
  ["crypto", "Crypto"],
  ["trader", "KI-Trader"],
  ["meta", "Meta-AI"],
  ["performance", "Performance"]
];
const COINS = ["BTC-USD", "ETH-USD", "SOL-USD"];
const LEER = "Nicht ausreichend Daten";
let standJetzt = null;
let zuletzt = "";
let seite = "dashboard";
let detail = null;
let filter = { bereich: "Alle", lage: "alle", richtung: "alle", sort: "bewegung" };
let traderFilter = { status: "alle", sort: "name", richtung: "ab" };
let zeit = "alles";

function text(knoten, wert) { knoten.textContent = wert == null || wert === "" ? "" : String(wert); }
function el(name, klasse) {
  const knoten = document.createElement(name);
  if (klasse) knoten.className = klasse;
  return knoten;
}
function zahl(wert) { return typeof wert === "number" && Number.isFinite(wert); }

function bestand() { return (standJetzt && standJetzt.bestand && standJetzt.bestand.zeilen) || []; }
function aktienZeilen() { return bestand().filter(function (zeile) { return zeile.bereich !== "Krypto"; }); }
function haendler() { return (standJetzt && standJetzt.papier && standJetzt.papier.haendler) || {}; }
function zentrale() { return haendler().zentrale || {}; }
function kryptoBuch() { return haendler().krypto || {}; }

function frischeLage(zeile) {
  if (!zeile) return "fehlend";
  return zeile.lage || "fehlend";
}

function kpi(titel, wert, ziel) {
  const knopf = el("button", "kpi");
  knopf.type = "button";
  const name = el("span");
  text(name, titel);
  const stark = el("strong", wert === LEER || String(wert).indexOf("Keine") === 0 ? "warn" : "");
  text(stark, wert == null || wert === "" ? LEER : String(wert));
  knopf.append(name, stark);
  knopf.addEventListener("click", function () { seite = ziel; detail = null; zeichnen(standJetzt); });
  return knopf;
}

function spark(reihe, klasse) {
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "spark");
  svg.setAttribute("viewBox", "0 0 120 36");
  if (!reihe || reihe.length < 2) {
    const hinweis = el("span", "ruhig");
    text(hinweis, "Kein Verlauf");
    return hinweis;
  }
  const unten = Math.min.apply(null, reihe);
  const oben = Math.max.apply(null, reihe);
  const spanne = oben - unten || 1;
  const punkte = reihe.map(function (wert, index) {
    const x = reihe.length === 1 ? 0 : (index / (reihe.length - 1)) * 120;
    const y = 32 - ((wert - unten) / spanne) * 28;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const linie = document.createElementNS(SVG, "polyline");
  linie.setAttribute("fill", "none");
  linie.setAttribute("stroke", reihe[reihe.length - 1] >= reihe[0] ? "#3dff9a" : "#ff8b98");
  linie.setAttribute("stroke-width", "2");
  linie.setAttribute("points", punkte);
  svg.append(linie);
  if (klasse) svg.classList.add(klasse);
  return svg;
}

function chip(label, klasse) {
  const span = el("span", "chip" + (klasse ? " " + klasse : ""));
  text(span, label);
  return span;
}

function richtungKlasse(zeile) {
  if (!zahl(zeile.tag_wert)) return "";
  if (zeile.tag_wert > 0) return "hoch";
  if (zeile.tag_wert < 0) return "runter";
  return "";
}

function datenChip(zeile) {
  const lage = frischeLage(zeile);
  if (lage === "analysiert") return chip("aktuell", "plus");
  if (lage === "veraltet") return chip("veraltet", "warn");
  if (lage === "ausstehend") return chip("ausstehend", "warn");
  return chip("fehlend", "warn");
}

function aktienKarte(zeile) {
  const karte = el("button", "karte " + richtungKlasse(zeile));
  karte.type = "button";
  const name = el("h2");
  text(name, zeile.name || zeile.symbol);
  const symbol = el("div", "symbol");
  text(symbol, zeile.symbol);
  const preis = el("div", "preis");
  text(preis, zeile.preis || LEER);
  const tag = el("div", richtungKlasse(zeile) === "hoch" ? "plus" : richtungKlasse(zeile) === "runter" ? "minus" : "ruhig");
  text(tag, zahl(zeile.tag_wert) ? zeile.tag : LEER);
  const chips = el("div", "chips");
  chips.append(datenChip(zeile), chip("Nicht validiert", "warn"));
  karte.append(name, symbol, preis, tag, spark(zeile.reihe), chips);
  karte.addEventListener("click", function () { detail = { art: "aktie", id: zeile.symbol }; zeichnen(standJetzt); });
  return karte;
}

function traderKarte(zeile) {
  const karte = el("button", "karte");
  karte.type = "button";
  const name = el("h2");
  text(name, zeile.name);
  const meta = el("div", "symbol");
  text(meta, (zeile.gruppe || "Profil") + " · " + (zeile.markt === "krypto" ? "Crypto" : "Aktien"));
  const chips = el("div", "chips");
  chips.append(chip(zeile.einsatz ? "aktiv" : "pausiert", zeile.einsatz ? "plus" : "warn"));
  chips.append(chip(zeile.rendite || LEER, String(zeile.rendite || "").indexOf("-") === 0 ? "minus" : ""));
  const werte = el("div", "meta");
  text(werte, "Erfolg " + (zeile.erfolg || LEER) + " · Drawdown " + (zeile.drawdown || LEER) + " · Trades " + (zeile.trades == null ? LEER : zeile.trades));
  const verlauf = (zeile.detail && zeile.detail.punkte || []).map(function (punkt) { return Number(punkt.equity); }).filter(zahl);
  karte.append(name, meta, spark(verlauf), chips, werte);
  karte.addEventListener("click", function () { detail = { art: "trader", id: zeile.name }; zeichnen(standJetzt); });
  return karte;
}

function diagramm(titel, punkte, hinweis) {
  const kasten = el("section", "diagramm");
  const name = el("h2");
  text(name, titel);
  kasten.append(name);
  const gefiltert = (punkte || []).filter(function (punkt) {
    const wert = punkt.wert != null ? Number(punkt.wert) : Number(punkt.equity);
    if (!Number.isFinite(wert)) return false;
    if (zeit === "alles" || !punkt.zeit) return zeit === "alles";
    const ende = Date.parse(punkt.zeit);
    const spanne = { "7d": 7, "30d": 30, "90d": 90, "180d": 180 }[zeit];
    return !!ende && Date.now() - ende <= spanne * 86400000;
  });
  if (gefiltert.length < 2) {
    const leer = el("p", "leer");
    text(leer, LEER + ". " + (hinweis || "Weniger als zwei gespeicherte Stände."));
    kasten.append(leer);
    return kasten;
  }
  const werte = gefiltert.map(function (punkt) { return punkt.wert != null ? Number(punkt.wert) : Number(punkt.equity); });
  const unten = Math.min.apply(null, werte);
  const oben = Math.max.apply(null, werte);
  const spanne = oben - unten || 1;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "linie");
  svg.setAttribute("viewBox", "0 0 640 180");
  const linie = document.createElementNS(SVG, "polyline");
  const xy = werte.map(function (wert, index) {
    const x = 8 + (index / (werte.length - 1)) * 624;
    const y = 164 - ((wert - unten) / spanne) * 148;
    return { x: x, y: y };
  });
  linie.setAttribute("fill", "none");
  linie.setAttribute("stroke", werte[werte.length - 1] >= werte[0] ? "#3dff9a" : "#ff8b98");
  linie.setAttribute("stroke-width", "2");
  linie.setAttribute("points", xy.map(function (punkt) { return punkt.x.toFixed(1) + "," + punkt.y.toFixed(1); }).join(" "));
  svg.append(linie);
  const tipp = el("p");
  text(tipp, "Zeige auf die Kurve.");
  gefiltert.forEach(function (punkt, index) {
    const kreis = document.createElementNS(SVG, "circle");
    kreis.setAttribute("cx", xy[index].x.toFixed(1));
    kreis.setAttribute("cy", xy[index].y.toFixed(1));
    kreis.setAttribute("r", "7");
    kreis.setAttribute("fill", "transparent");
    kreis.addEventListener("mouseenter", function () {
      text(tipp, (punkt.zeit || "ohne Zeit") + " · " + werte[index].toFixed(2) + " Euro");
    });
    svg.append(kreis);
  });
  const achse = el("p", "ruhig");
  text(achse, unten.toFixed(2) + " bis " + oben.toFixed(2) + " Euro");
  kasten.append(svg, achse, tipp);
  return kasten;
}

function zeitWahl(block) {
  const leiste = el("div", "filter");
  [["7d", "7 Tage"], ["30d", "30 Tage"], ["90d", "90 Tage"], ["180d", "180 Tage"], ["alles", "Gesamt"]].forEach(function (paar) {
    const knopf = el("button", zeit === paar[0] ? "aktiv" : "");
    knopf.type = "button";
    text(knopf, paar[1]);
    knopf.addEventListener("click", function () { zeit = paar[0]; zeichnen(standJetzt); });
    leiste.append(knopf);
  });
  block.append(leiste);
}

function fortschritt(block) {
  (standJetzt.bild || []).forEach(function (zeile) {
    if (!zeile || !zeile.von) return;
    const kasten = el("div", "panel");
    const name = el("div");
    text(name, zeile.name + " " + zeile.wert + " / " + zeile.von);
    const spur = el("div", "balken");
    const fuell = el("span");
    fuell.style.width = Math.max(0, Math.min(100, (zeile.wert / zeile.von) * 100)) + "%";
    spur.append(fuell);
    kasten.append(name, spur);
    block.append(kasten);
  });
}

function dashboard() {
  const block = el("div");
  const aktien = aktienZeilen();
  const analysiert = aktien.filter(function (zeile) { return zeile.lage === "analysiert"; }).length;
  const chancen = ((standJetzt && standJetzt.prognosen) || []).filter(function (eintrag) { return eintrag.p_hoch != null; }).length;
  const reihe = el("div", "kpi-reihe");
  reihe.append(kpi("Erfasste Aktien", String(aktien.length || (standJetzt.abdeckung && standJetzt.abdeckung.symbole) || LEER), "aktien"));
  reihe.append(kpi("Analysiert", String(analysiert), "aktien"));
  reihe.append(kpi("Chancen", chancen ? String(chancen) : "0", "aktien"));
  reihe.append(kpi("Aktive Trader", haendler().aktiv == null ? LEER : String(haendler().aktiv), "trader"));
  reihe.append(kpi("Paper-Performance", zentrale().rendite || LEER, "performance"));
  reihe.append(kpi("Status", standJetzt.arbeitet ? "Misst" : "Bereit", "aktien"));
  block.append(reihe);
  const hinweis = el("p", "ruhig");
  text(hinweis, chancen ? "" : "Validierte Chancen: " + LEER + ".");
  block.append(hinweis);
  block.append(diagramm("Gesamtperformance", zentrale().gesamt, zentrale().hinweis));
  const raster = el("div", "raster");
  const bewegung = aktien.filter(function (zeile) { return zeile.lage === "analysiert" && zahl(zeile.tag_wert); })
    .sort(function (a, b) { return Math.abs(b.tag_wert) - Math.abs(a.tag_wert); })
    .slice(0, 4);
  bewegung.forEach(function (zeile) { raster.append(aktienKarte(zeile)); });
  COINS.forEach(function (symbol) {
    raster.append(aktienKarte(bestand().find(function (zeile) { return zeile.symbol === symbol; }) || { symbol: symbol, name: symbol, bereich: "Krypto", lage: "fehlend" }));
  });
  (haendler().rangliste || []).slice(0, 4).forEach(function (zeile) { raster.append(traderKarte(zeile)); });
  block.append(raster);
  const meta = el("button", "panel");
  meta.type = "button";
  const kopf = el("h2");
  text(kopf, "Meta-AI");
  const satz = el("p");
  const bericht = haendler().meta_bericht || {};
  text(satz, (bericht.phasen && bericht.phasen.phase) ? ("Marktphase " + bericht.phasen.phase) : "Marktphase nicht gemessen");
  const gewicht = el("p", "ruhig");
  text(gewicht, Object.keys(bericht.gewichte || {}).length ? "Gewichtung aus bestandener Prüfung." : "Keine Gewichtung. " + LEER + ".");
  meta.append(kopf, satz, gewicht);
  meta.addEventListener("click", function () { seite = "meta"; detail = null; zeichnen(standJetzt); });
  block.append(meta);
  return block;
}

function filterLeiste() {
  const leiste = el("div", "filter");
  function knopf(gruppe, wert, label) {
    const knoten = el("button", filter[gruppe] === wert ? "aktiv" : "");
    knoten.type = "button";
    text(knoten, label);
    knoten.addEventListener("click", function () { filter[gruppe] = wert; zeichnen(standJetzt); });
    leiste.append(knoten);
  }
  ["Alle", "USA", "Deutschland", "Europa", "ETFs"].forEach(function (name) { knopf("bereich", name, name); });
  knopf("lage", "alle", "Alle Zustände");
  knopf("lage", "analysiert", "Analysiert");
  knopf("lage", "ausstehend", "Ausstehend");
  knopf("lage", "veraltet", "Veraltet");
  knopf("lage", "fehlend", "Fehlend");
  knopf("richtung", "alle", "Beide Richtungen");
  knopf("richtung", "hoch", "Steigend");
  knopf("richtung", "runter", "Fallend");
  knopf("sort", "bewegung", "Tagesveränderung");
  knopf("sort", "vorsprung", "Vorsprung");
  knopf("sort", "name", "Name");
  return leiste;
}

function gefilterteAktien() {
  const suche = document.getElementById("suche").value.trim().toLowerCase();
  return aktienZeilen().filter(function (zeile) {
    if (filter.bereich !== "Alle" && zeile.bereich !== filter.bereich) return false;
    if (filter.lage !== "alle" && zeile.lage !== filter.lage) return false;
    if (filter.richtung === "hoch" && !(zahl(zeile.tag_wert) && zeile.tag_wert > 0)) return false;
    if (filter.richtung === "runter" && !(zahl(zeile.tag_wert) && zeile.tag_wert < 0)) return false;
    if (!suche) return true;
    return ((zeile.name || "") + " " + zeile.symbol).toLowerCase().indexOf(suche) !== -1;
  }).sort(function (a, b) {
    if (filter.sort === "name") return String(a.name).localeCompare(String(b.name), "de");
    const feld = filter.sort === "vorsprung" ? "aufwaerts" : "tag_wert";
    const links = zahl(a[feld]) ? a[feld] : -Infinity;
    const rechts = zahl(b[feld]) ? b[feld] : -Infinity;
    return rechts - links;
  });
}

function aktienSeite() {
  const block = el("div");
  const kopf = el("p", "ruhig");
  const abdeckung = standJetzt.abdeckung || {};
  text(kopf, abdeckung.hinweis || "Index je Aktie ist nicht gespeichert. Branche ist nicht gespeichert.");
  block.append(kopf);
  const fortschrittBlock = el("div", "raster");
  fortschritt(fortschrittBlock);
  block.append(fortschrittBlock, filterLeiste());
  const liste = gefilterteAktien();
  if (!liste.length) {
    const leer = el("p", "leer");
    text(leer, standJetzt.arbeitet ? "Die Kurse kommen." : "Keine Aktie für diesen Filter.");
    block.append(leer);
    return block;
  }
  const raster = el("div", "raster");
  liste.forEach(function (zeile) { raster.append(aktienKarte(zeile)); });
  block.append(raster);
  return block;
}

function cryptoSeite() {
  const block = el("div");
  const raster = el("div", "raster");
  const gesehen = {};
  COINS.forEach(function (symbol) { gesehen[symbol] = true; });
  const coins = COINS.map(function (symbol) {
    return bestand().find(function (zeile) { return zeile.symbol === symbol; }) || { symbol: symbol, name: symbol, bereich: "Krypto", lage: "fehlend" };
  }).concat(bestand().filter(function (zeile) { return zeile.bereich === "Krypto" && !gesehen[zeile.symbol]; }));
  coins.forEach(function (zeile) { raster.append(aktienKarte(zeile)); });
  block.append(raster);
  const buch = el("div", "kpi-reihe");
  buch.append(kpi("Kapital", kryptoBuch().kapital || LEER, "performance"));
  buch.append(kpi("Rendite", kryptoBuch().rendite || LEER, "performance"));
  buch.append(kpi("Drawdown", kryptoBuch().drawdown || LEER, "performance"));
  block.append(buch);
  const trader = el("div", "raster");
  (haendler().rangliste || []).filter(function (zeile) { return zeile.markt === "krypto"; }).forEach(function (zeile) { trader.append(traderKarte(zeile)); });
  block.append(trader);
  return block;
}

function traderListe(liste, suche, status, sort, richtung) {
  const textSuche = String(suche || "").trim().toLowerCase();
  const gefiltert = (liste || []).filter(function (zeile) {
    if (status === "aktiv" && !zeile.einsatz) return false;
    if (status === "pausiert" && zeile.einsatz) return false;
    if (!textSuche) return true;
    return String(zeile.name || "").toLowerCase().indexOf(textSuche) !== -1;
  });
  return gefiltert.slice().sort(function (a, b) {
    if (sort === "name") return String(a.name).localeCompare(String(b.name), "de");
    const links = zahl(a[sort]) ? a[sort] : null;
    const rechts = zahl(b[sort]) ? b[sort] : null;
    if (links == null && rechts == null) return String(a.name).localeCompare(String(b.name), "de");
    if (links == null) return 1;
    if (rechts == null) return -1;
    return richtung === "auf" ? links - rechts : rechts - links;
  });
}

function traderSeite() {
  const block = el("div");
  const leiste = el("div", "filter");
  [["alle", "Alle"], ["aktiv", "Aktiv"], ["pausiert", "Pausiert"]].forEach(function (paar) {
    const knopf = el("button", traderFilter.status === paar[0] ? "aktiv" : "");
    knopf.type = "button";
    text(knopf, paar[1]);
    knopf.addEventListener("click", function () { traderFilter.status = paar[0]; zeichnen(standJetzt); });
    leiste.append(knopf);
  });
  const suche = document.getElementById("suche").value;
  const raster = el("div", "raster");
  traderListe(haendler().rangliste || [], suche, traderFilter.status, traderFilter.sort, traderFilter.richtung).forEach(function (zeile) { raster.append(traderKarte(zeile)); });
  block.append(leiste);
  if (!raster.childElementCount) {
    const leer = el("p", "leer");
    text(leer, LEER);
    block.append(leer);
  }
  block.append(raster);
  return block;
}

function metaSeite() {
  const block = el("div");
  const bericht = haendler().meta_bericht || {};
  const phase = bericht.phasen || {};
  const karten = el("div", "kpi-reihe");
  karten.append(kpi("Marktphase", phase.phase || "nicht gemessen", "performance"));
  karten.append(kpi("Gewichtet", String(Object.keys(bericht.gewichte || {}).length), "trader"));
  karten.append(kpi("Crypto gewichtet", String(Object.keys(bericht.krypto_gewichte || {}).length), "crypto"));
  karten.append(kpi("Prognosen", (standJetzt.prognose_qualitaet && standJetzt.prognose_qualitaet.status) || LEER, "aktien"));
  block.append(karten);
  const panel = el("section", "panel");
  const titel = el("h2");
  text(titel, Object.keys(bericht.gewichte || {}).length ? "Bestandene Prüfung" : "Keine freigegebene Gewichtung");
  const satz = el("p");
  text(satz, bericht.hinweis || LEER);
  panel.append(titel, satz);
  const details = el("details");
  const summary = el("summary");
  text(summary, "Stärken, Schwächen, Prüfstatus");
  const liste = el("div");
  (haendler().rangliste || []).forEach(function (zeile) {
    const zeileText = el("div", "zeile");
    const name = el("span");
    text(name, zeile.name + " · " + (zeile.gruppe || ""));
    const wert = el("span", zeile.belastbar ? "plus" : "warn");
    text(wert, zeile.validierung || LEER);
    zeileText.append(name, wert);
    liste.append(zeileText);
  });
  details.append(summary, liste);
  panel.append(details);
  block.append(panel);
  return block;
}

function vergleich(block) {
  const kasten = el("section", "diagramm");
  const titel = el("h2");
  text(titel, "Trader mit gemessener Rendite");
  kasten.append(titel);
  const liste = (haendler().rangliste || []).filter(function (zeile) { return zahl(zeile.rendite_zahl); });
  if (liste.length < 1) {
    const leer = el("p", "leer");
    text(leer, "Rendite " + LEER + ". Fehlende Bücher sind keine Null.");
    kasten.append(leer);
    block.append(kasten);
    return;
  }
  const maximum = Math.max.apply(null, liste.map(function (zeile) { return Math.abs(zeile.rendite_zahl); })) || 1;
  liste.sort(function (a, b) { return b.rendite_zahl - a.rendite_zahl; }).forEach(function (zeile) {
    const zeileText = el("div", "zeile");
    const name = el("span");
    text(name, zeile.name);
    const spur = el("div", "balken");
    const fuell = el("span");
    fuell.style.width = Math.max(4, Math.abs(zeile.rendite_zahl) / maximum * 100) + "%";
    fuell.style.background = zeile.rendite_zahl < 0 ? "#ff8b98" : "#3dff9a";
    spur.append(fuell);
    const wert = el("span", zeile.rendite_zahl < 0 ? "minus" : "plus");
    text(wert, zeile.rendite);
    zeileText.append(name, spur, wert);
    kasten.append(zeileText);
  });
  block.append(kasten);
}

function performanceSeite() {
  const block = el("div");
  zeitWahl(block);
  const karten = el("div", "kpi-reihe");
  karten.append(kpi("Rendite", zentrale().rendite || LEER, "performance"));
  karten.append(kpi("Drawdown", zentrale().drawdown || LEER, "performance"));
  karten.append(kpi("Crypto-Rendite", kryptoBuch().rendite || LEER, "crypto"));
  karten.append(kpi("Benchmark", "nicht gemessen", "performance"));
  block.append(karten);
  const zwei = el("div", "zwei");
  zwei.append(diagramm("Aktien-Equity", zentrale().gesamt, zentrale().hinweis));
  zwei.append(diagramm("Crypto-Equity", kryptoBuch().gesamt, kryptoBuch().hinweis));
  block.append(zwei);
  block.append(diagramm("Realisiert", zentrale().realisiert_punkte, "Nur gespeicherte Nettoergebnisse."));
  vergleich(block);
  return block;
}

function aktienDetail(zeile) {
  const block = el("div");
  const zurueck = el("button");
  zurueck.type = "button";
  text(zurueck, "Zurück");
  zurueck.addEventListener("click", function () { detail = null; zeichnen(standJetzt); });
  block.append(zurueck, aktienKarte(zeile));
  const prognosen = ((standJetzt && standJetzt.prognosen) || []).filter(function (eintrag) { return eintrag.symbol === zeile.symbol; });
  const panel = el("section", "panel");
  const titel = el("h2");
  text(titel, "Prognose");
  panel.append(titel);
  if (!prognosen.length || prognosen.every(function (eintrag) { return eintrag.p_hoch == null; })) {
    const satz = el("p", "warn");
    text(satz, "Noch nicht validiert. " + LEER + ".");
    panel.append(satz);
  } else {
    prognosen.forEach(function (eintrag) {
      const zeileText = el("div", "zeile");
      text(zeileText, eintrag.horizont + " " + eintrag.art + " · " + (eintrag.p_hoch == null ? LEER : eintrag.p_hoch));
      panel.append(zeileText);
    });
  }
  if (zahl(zeile.aufwaerts)) {
    const vorsprung = el("p");
    text(vorsprung, "Gemessener Vorsprung " + zeile.aufwaerts + ". Das ist keine Wahrscheinlichkeit.");
    panel.append(vorsprung);
  }
  const quelle = el("p", "ruhig");
  text(quelle, zeile.herkunft || "Quelle fehlt");
  panel.append(quelle);
  const meldungen = [];
  ["tag", "woche", "monate"].forEach(function (key) {
    const blockNews = standJetzt.nachrichten && standJetzt.nachrichten[key];
    (blockNews && blockNews.meldungen || []).forEach(function (meldung) {
      if (meldung.symbol === zeile.symbol) meldungen.push(meldung);
    });
  });
  if (meldungen.length) {
    const news = el("details");
    const summary = el("summary");
    text(summary, "Nachrichten");
    meldungen.slice(0, 5).forEach(function (meldung) {
      const satz = el("p");
      text(satz, meldung.titel || meldung.symbol);
      news.append(satz);
    });
    news.prepend(summary);
    panel.append(news);
  }
  block.append(panel);
  return block;
}

function traderDetail(zeile) {
  const block = el("div");
  const zurueck = el("button");
  zurueck.type = "button";
  text(zurueck, "Zurück");
  zurueck.addEventListener("click", function () { detail = null; zeichnen(standJetzt); });
  const kopf = el("section", "panel");
  const titel = el("h2");
  text(titel, zeile.name);
  const profil = el("p");
  text(profil, (zeile.gruppe || "") + " · " + (zeile.regel || ""));
  const status = el("p", "ruhig");
  text(status, zeile.lernstatus || LEER);
  const werte = el("div", "kpi-reihe");
  werte.append(kpi("Kapital", (zeile.detail && zeile.detail.start) || LEER, "trader"));
  werte.append(kpi("Rendite", zeile.rendite || LEER, "performance"));
  werte.append(kpi("Erfolg", zeile.erfolg || LEER, "trader"));
  werte.append(kpi("Drawdown", zeile.drawdown || LEER, "performance"));
  werte.append(kpi("Trades", zeile.trades == null ? LEER : String(zeile.trades), "trader"));
  werte.append(kpi("Version", zeile.version == null ? LEER : String(zeile.version), "trader"));
  kopf.append(titel, profil, status);
  block.append(zurueck, kopf, werte);
  block.append(diagramm(zeile.name, (zeile.detail && zeile.detail.punkte) || [], "Eigenes Buch."));
  const details = el("details");
  const summary = el("summary");
  text(summary, "Entscheidungen und Versionen");
  const inhalt = el("div");
  ((zeile.detail && zeile.detail.entscheidungen) || []).slice(0, 8).forEach(function (eintrag) {
    const satz = el("p");
    text(satz, (eintrag.zeit || "") + " " + (eintrag.entscheidung || "") + " " + (eintrag.grund || ""));
    inhalt.append(satz);
  });
  ((zeile.detail && zeile.detail.versionen) || []).slice(0, 6).forEach(function (eintrag) {
    const satz = el("p", "ruhig");
    text(satz, "Version " + (eintrag.version == null ? "" : eintrag.version) + " " + (eintrag.grund || eintrag.status || ""));
    inhalt.append(satz);
  });
  if (!inhalt.childElementCount) text(inhalt, LEER);
  details.append(summary, inhalt);
  block.append(details);
  return block;
}

function detailBlick() {
  if (!detail) return dashboard();
  if (detail.art === "aktie") {
    const zeile = bestand().find(function (eintrag) { return eintrag.symbol === detail.id; });
    if (!zeile) { detail = null; return dashboard(); }
    return aktienDetail(zeile);
  }
  const zeile = (haendler().rangliste || []).find(function (eintrag) { return eintrag.name === detail.id; });
  if (!zeile) { detail = null; return dashboard(); }
  return traderDetail(zeile);
}

function navigation() {
  const nav = document.getElementById("nav");
  const fokus = document.activeElement && document.activeElement.closest && document.activeElement.closest("#nav");
  nav.replaceChildren();
  NAV.forEach(function (paar) {
    const knopf = el("button", seite === paar[0] && !detail ? "aktiv" : "");
    knopf.type = "button";
    text(knopf, paar[1]);
    knopf.addEventListener("click", function () { seite = paar[0]; detail = null; zeichnen(standJetzt); });
    nav.append(knopf);
  });
  const status = el("p", "status");
  const papier = (standJetzt && standJetzt.papier) || {};
  text(status, "Simulation. Kein echtes Geld. " + (papier.hinweis || ""));
  nav.append(status);
  if (fokus) nav.querySelector(".aktiv") && nav.querySelector(".aktiv").focus();
}

function zeichnen(stand) {
  if (!stand) return;
  const feld = document.getElementById("suche");
  const fokus = document.activeElement === feld;
  const caret = fokus ? feld.selectionStart : null;
  standJetzt = stand;
  text(document.getElementById("uhr"), stand.uhr || "");
  const knopf = document.getElementById("neu");
  knopf.disabled = !!stand.arbeitet;
  text(knopf, stand.arbeitet ? "Misst …" : "Aktualisieren");
  navigation();
  const inhalt = document.getElementById("inhalt");
  const ansicht = detail ? detailBlick() : { dashboard: dashboard, aktien: aktienSeite, crypto: cryptoSeite, trader: traderSeite, meta: metaSeite, performance: performanceSeite }[seite]();
  inhalt.replaceChildren(ansicht);
  if (fokus) {
    feld.focus();
    if (caret != null) feld.setSelectionRange(caret, caret);
  }
}

async function laden() {
  try {
    const antwort = await fetch("/stand");
    if (!antwort.ok) return;
    const roh = await antwort.text();
    if (roh === zuletzt) return;
    zuletzt = roh;
    zeichnen(JSON.parse(roh));
  } catch (fehler) {}
}

document.getElementById("suche").addEventListener("input", function () {
  if (seite !== "aktien" && seite !== "crypto" && seite !== "trader") seite = "aktien";
  detail = null;
  if (standJetzt) zeichnen(standJetzt);
});
document.getElementById("finden").addEventListener("click", async function () {
  const treffer = document.getElementById("treffer");
  treffer.replaceChildren();
  const antwort = await fetch("/suche?q=" + encodeURIComponent(document.getElementById("suche").value.trim()));
  const daten = await antwort.json();
  (daten.treffer || []).forEach(function (eintrag) {
    const knopf = el("button");
    knopf.type = "button";
    text(knopf, eintrag.symbol + " · " + eintrag.name);
    knopf.addEventListener("click", async function () {
      await fetch("/liste", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ symbol: eintrag.symbol }) });
      knopf.disabled = true;
      text(knopf, eintrag.symbol + " ist auf der Liste");
    });
    treffer.append(knopf);
  });
  if (!treffer.childElementCount) {
    const hinweis = el("p", "leer");
    text(hinweis, daten.meldung || "Nichts gefunden.");
    treffer.append(hinweis);
  }
});
document.getElementById("neu").addEventListener("click", async function () {
  this.disabled = true;
  zuletzt = "";
  try { await fetch("/neu"); } catch (fehler) {}
});
navigation();
laden();
setInterval(laden, 1000);
</script>
