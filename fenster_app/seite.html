<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarktRadar</title>
<style>
  :root { color-scheme: dark; --gruen: #3dff9a; --cyan: #7af6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: #e9fff4; }
  body {
    font-family: "Helvetica Neue", Helvetica, sans-serif;
    background:
      radial-gradient(900px 420px at 0% -10%, rgba(61, 255, 154, .18), transparent 60%),
      radial-gradient(700px 380px at 100% 0%, rgba(122, 246, 255, .1), transparent 55%),
      linear-gradient(rgba(61, 255, 154, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61, 255, 154, .045) 1px, transparent 1px),
      #050a08;
    background-size: auto, auto, 56px 56px, 56px 56px, auto;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 28px 12px;
    border-bottom: 1px solid rgba(61, 255, 154, .22);
  }
  h1 {
    margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .28em;
    color: var(--gruen); text-shadow: 0 0 18px rgba(61, 255, 154, .75);
  }
  .werkzeuge { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  button, .abt {
    background: rgba(61, 255, 154, .08); color: var(--gruen);
    border: 1px solid rgba(61, 255, 154, .45); border-radius: 999px;
    padding: 7px 14px; font: inherit; cursor: pointer;
    box-shadow: 0 0 16px rgba(61, 255, 154, .18);
  }
  #suche {
    width: 150px; background: rgba(5, 16, 12, .85); color: #e9fff4;
    border: 1px solid rgba(61, 255, 154, .4); border-radius: 999px;
    padding: 7px 12px; font: inherit;
  }
  .abt.aktiv { background: rgba(61, 255, 154, .22); color: #e9fff4; }
  #uhr, #status, #markt, .symbol, .extra, .leer, .achsen { color: #8fb9a4; }
  #treffer { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #treffer button { font: inherit; color: #e7fff4; background: #12362a; border: 1px solid #2f6d56; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  #pille {
    border: 1px solid rgba(122, 246, 255, .45); color: var(--cyan);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; letter-spacing: .08em;
    box-shadow: 0 0 14px rgba(122, 246, 255, .25);
  }
  main {
    display: grid; grid-template-columns: 320px 1fr; gap: 16px;
    height: calc(100% - 64px); padding: 16px 28px 22px;
  }
  aside {
    padding: 20px; overflow: auto;
    display: flex; flex-direction: column;
    background: rgba(6, 22, 16, .86);
    border: 1px solid rgba(61, 255, 154, .28); border-radius: 18px;
    box-shadow: inset 0 0 40px rgba(61, 255, 154, .05), 0 0 28px rgba(61, 255, 154, .08);
  }
  #chat { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; min-height: 240px; flex: 1; }
  #verlauf { flex: 1; overflow: auto; max-height: 320px; display: flex; flex-direction: column; gap: 8px; }
  .blase { margin: 0; padding: 8px 10px; border-radius: 12px; font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
  .blase.ich { align-self: flex-end; background: rgba(61, 255, 154, .16); }
  .blase.sie { align-self: flex-start; background: rgba(233, 255, 244, .06); }
  #frage { display: flex; gap: 8px; }
  #satz { flex: 1; min-width: 0; background: rgba(5, 16, 12, .85); color: #e9fff4; border: 1px solid rgba(61, 255, 154, .4); border-radius: 999px; padding: 7px 12px; font: inherit; }
  .marke, h2 {
    margin: 0 0 12px; color: var(--gruen); font-size: 11px; letter-spacing: .18em; font-weight: 700;
  }
  #brief { margin: 0; font-size: 17px; line-height: 1.45; white-space: pre-wrap; }
  #status, #markt, .erklaerung { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  #status { margin: 14px 0 0; }
  #markt { margin: 10px 0 0; }
  #einschaetzung { margin: 12px 0 0; color: #d7f5e4; font-size: 13px; line-height: 1.45; }
  #papier { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  #papier-modus { margin: 0; font-size: 12px; line-height: 1.4; }
  .papier-knopf { display: flex; flex-wrap: wrap; gap: 8px; }
  #flaeche { min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 4px; }
  #karten { overflow: visible; }
  #papier-brett { display: none; }
  body.alpaka #papier-brett { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  #papier-brett .breit { grid-column: 1 / -1; }
  #papier-brett button.breit { font: inherit; color: #e7fff4; background: #12362a; border: 1px solid #2f6d56; border-radius: 999px; padding: 8px 14px; cursor: pointer; justify-self: start; }
  .kontozeile { margin: 0; padding: 8px 0; border-bottom: 1px solid rgba(61, 255, 154, .16); font-size: 16px; }
  .kontozeile.plus { color: #3dff9a; }
  .kontozeile.minus { color: #ff6b6b; }
  .ki-filter, .ki-sort { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .ki-filter button, .ki-sort button { font-size: 13px; padding: 4px 8px; }
  .ki-scroll { max-height: 360px; overflow: auto; }
  table.ki { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ki th, table.ki td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(61, 255, 154, .16); white-space: nowrap; }
  table.ki tr.wahl { background: rgba(61, 255, 154, .08); }
  .ki-detail { font-size: 14px; line-height: 1.45; }
  body.alpaka #karten { display: none; }
  .buch { padding: 16px; border-radius: 18px; border: 1px solid rgba(61, 255, 154, .28); background: rgba(6, 22, 16, .86); }
  .buch h2 { margin-bottom: 4px; }
  .buch .regel, .buch .bar, .nicht { margin: 6px 0 0; color: #8fb9a4; font-size: 12px; line-height: 1.4; }
  .buch .geld { margin: 6px 0 0; color: #e9fff4; font-size: 20px; line-height: 1.2; }
  .standzahl { margin: 8px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .standzahl.plus { color: #3dff9a; }
  .standzahl.minus { color: #ff8b98; }
  .standzahl.null { color: #e9fff4; }
  .kauf { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(61, 255, 154, .16); }
  .kauf strong { display: block; font-size: 18px; }
  .kauf .standzahl { font-size: 28px; }
  .kauf .kurs { margin: 4px 0 0; color: #d7f5e4; font-size: 14px; }
  .vorschlag { margin: 8px 0 0; color: #d7f5e4; font-size: 13px; line-height: 1.4; white-space: pre-line; }
  .anteil .zeile { font-size: 12px; }
  .anteil strong { margin-left: auto; color: #e9fff4; font-weight: 650; }
  .spur { position: relative; height: 8px; margin-top: 4px; border-radius: 999px; background: rgba(233, 255, 244, .08); overflow: hidden; }
  .spur .fuell { height: 100%; width: 0; }
  .spur.laeuft { background: rgba(122, 246, 255, .14); }
  .spur.laeuft::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    left: -30%;
    background: linear-gradient(90deg, transparent, rgba(122, 246, 255, .9), transparent);
    animation: laeuft 1.1s linear infinite;
  }
  .laeuft-text { color: var(--cyan); font-size: 11px; letter-spacing: .08em; }
  @keyframes laeuft { to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .spur.laeuft::after { animation: none; left: 0; width: 100%; opacity: .35; }
  }
  .bewegung { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bewegung .spur { flex: 1; margin-top: 0; }
  .bewegung strong { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips span { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid rgba(61, 255, 154, .45); color: var(--gruen); }
  .karte .fenster { display: none; }
  .karte.offen .fenster { display: block; }
  details.falt { margin: 0 0 18px; }
  details.falt summary { cursor: pointer; color: var(--gruen); letter-spacing: .18em; font-size: 11px; font-weight: 700; }
  #karten { overflow: auto; padding-right: 4px; }
  .leiste { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .abt strong { color: #e9fff4; font-weight: 700; margin-left: 6px; }
  section { margin-bottom: 18px; }
  .raster { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .karte {
    padding: 14px; cursor: pointer;
    background: rgba(7, 24, 18, .9);
    border: 1px solid rgba(61, 255, 154, .22); border-radius: 16px;
    box-shadow: 0 0 22px rgba(61, 255, 154, .06);
  }
  .karte:hover { border-color: rgba(61, 255, 154, .6); box-shadow: 0 0 24px rgba(61, 255, 154, .18); }
  .zeile, .meta { display: flex; align-items: baseline; gap: 10px; }
  .name { font-size: 16px; font-weight: 700; }
  .preis { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 16px; color: var(--gruen); text-align: right; }
  .herkunft { display: block; margin-top: 2px; color: #8fb9a4; font-family: "Helvetica Neue", Helvetica, sans-serif; font-size: 11px; font-weight: 400; }
  .fenster { margin: 8px 0 0; color: #d7f5e4; font-size: 13px; line-height: 1.4; }
  .meta { margin-top: 4px; font-size: 12px; }
  .chip { margin-left: auto; border-radius: 999px; padding: 2px 8px; border: 1px solid transparent; }
  .grund, .extra { margin: 10px 0 0; line-height: 1.4; font-size: 13px; white-space: pre-wrap; }
  .grund { display: block; color: #d7ffe9; }
  .extra { display: none; }
  .karte.offen .extra { display: block; }
  .meldung { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: rgba(7, 24, 18, .9); border: 1px solid rgba(61, 255, 154, .22); }
  .meldung .titel { margin: 0; font-size: 14px; }
  .meldung .meta, .betroffen { margin: 4px 0 0; color: #8fb9a4; font-size: 12px; }
  .raster.rang { grid-template-columns: 1fr; }
  .hoch { color: var(--gruen); text-shadow: 0 0 10px rgba(61, 255, 154, .45); }
  .runter { color: #ff6b7d; }
  .einstieg_pruefen { background: rgba(61, 255, 154, .16); color: var(--gruen); border-color: rgba(61, 255, 154, .5); }
  .sparplan { background: rgba(122, 246, 255, .12); color: var(--cyan); border-color: rgba(122, 246, 255, .4); }
  .beobachten { background: rgba(233, 255, 244, .06); color: #d7ffe9; }
  .abwarten { background: rgba(255, 196, 87, .1); color: #ffd27a; }
  .vorsicht, .fehler, .verkauf_pruefen { background: rgba(255, 107, 125, .12); color: #ff8b98; }
  .unklar, .unvollstaendig { color: #8fb9a4; }
  .leer { margin: 8px 4px; }
  .potenzial { display: none; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid rgba(61, 255, 154, .4); background: rgba(61, 255, 154, .07); box-shadow: 0 0 18px rgba(61, 255, 154, .12); }
  .karte.offen .potenzial { display: block; }
  .score { margin: 0; font-family: ui-monospace, Menlo, monospace; color: var(--gruen); }
  .meter { height: 8px; margin: 8px 0; border-radius: 999px; background: rgba(233, 255, 244, .08); overflow: hidden; }
  .fuell { display: block; height: 100%; background: #3dff9a; box-shadow: 0 0 12px #3dff9a; }
  .fuell.mittel { background: #ffd27a; box-shadow: 0 0 12px #ffd27a; }
  .fuell.niedrig { background: #ff6b7d; box-shadow: 0 0 12px #ff6b7d; }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; height: auto; }
    .raster, #papier-brett { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>MARKTRADAR</h1>
  <div class="werkzeuge">
    <input id="suche" type="search" placeholder="Suchen" aria-label="Suchen">
    <button id="finden" type="button">Kürzel suchen</button>
    <button id="neu" type="button">Noch einmal schauen</button>
    <span id="uhr"></span>
    <span id="pille">…</span>
  </div>
</header>
<main>
  <aside>
    <p class="marke">STAND</p>
    <p id="brief">Ich hole die Kurse.</p>
    <p id="status">Die Liste steht in der watchlist.txt.</p>
    <div id="balken"></div>
    <p id="einschaetzung"></p>
    <div id="treffer"></div>
    <p id="markt"></p>
    <section id="papier">
      <p class="marke">KI PAPER TRADING</p>
      <p id="papier-modus">Simulation. Kein echtes Geld. Paper-Handel ist aus.</p>
      <div class="papier-knopf">
        <button id="papier-zeigen" type="button">Alpaka</button>
        <button id="papier-an" type="button">Paper-Handel einschalten</button>
        <button id="papier-stopp" type="button">Stopp</button>
      </div>
    </section>
    <div id="chat">
      <p class="marke">GESPRÄCH</p>
      <div id="verlauf"></div>
      <form id="frage">
        <input id="satz" type="text" placeholder="Frag nach einem Namen" aria-label="Frage an MarktRadar" maxlength="500">
        <button type="submit">Senden</button>
      </form>
    </div>
  </aside>
  <div id="flaeche">
    <section id="papier-brett"></section>
    <section id="karten"></section>
  </div>
</main>
<script>
const SVG = "http://www.w3.org/2000/svg";
const BEREICHE = ["Krypto", "USA", "Deutschland", "Europa", "ETFs"];
let bereichFilter = "Alle";
let suche = "";
let standJetzt = null;
const brief = document.getElementById("brief");
const statusText = document.getElementById("status");
const markt = document.getElementById("markt");
const uhr = document.getElementById("uhr");
const pille = document.getElementById("pille");
const knopf = document.getElementById("neu");
const karten = document.getElementById("karten");
let zuletzt = "";

function text(knoten, wert) { knoten.textContent = wert || ""; }

function graph(werte, breite, hoehe) {
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 " + breite + " " + hoehe);
  svg.setAttribute("class", hoehe > 100 ? "graph gross" : "graph");
  if (!werte || werte.length < 2) {
    const hinweis = document.createElementNS(SVG, "text");
    hinweis.setAttribute("x", "8");
    hinweis.setAttribute("y", String(hoehe / 2));
    hinweis.setAttribute("fill", "#8fb9a4");
    hinweis.setAttribute("font-size", "12");
    hinweis.textContent = "Kein Kursverlauf";
    svg.append(hinweis);
    return svg;
  }
  const tief = Math.min.apply(null, werte);
  const hoch = Math.max.apply(null, werte);
  const spanne = hoch - tief || 1;
  const oben = werte[werte.length - 1] >= werte[0];
  const farbe = oben ? "#3dff9a" : "#ff6b7d";
  const punkte = werte.map(function (wert, index) {
    const x = (index / (werte.length - 1)) * breite;
    const y = (hoehe - 10) - ((wert - tief) / spanne) * (hoehe - 20);
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const flaeche = document.createElementNS(SVG, "polygon");
  flaeche.setAttribute("points", "0," + hoehe + " " + punkte.join(" ") + " " + breite + "," + hoehe);
  flaeche.setAttribute("fill", oben ? "rgba(61,255,154,.16)" : "rgba(255,107,125,.12)");
  const linie = document.createElementNS(SVG, "polyline");
  linie.setAttribute("points", punkte.join(" "));
  linie.setAttribute("fill", "none");
  linie.setAttribute("stroke", farbe);
  linie.setAttribute("stroke-width", "2.4");
  linie.setAttribute("stroke-linejoin", "round");
  linie.setAttribute("stroke-linecap", "round");
  svg.append(flaeche, linie);
  return svg;
}

function anteil(zeile, laeuft) {
  const block = document.createElement("div");
  block.className = "anteil";
  const kopf = document.createElement("div");
  kopf.className = "zeile";
  const name = document.createElement("span");
  text(name, zeile.name);
  const von = Number(zeile.von) || 0;
  const wert = Number(zeile.wert) || 0;
  const pct = von ? Math.round(wert / von * 100) : 0;
  const zahl = document.createElement("strong");
  text(zahl, wert + " / " + von + " · " + pct + " %");
  kopf.append(name, zahl);
  if (laeuft) {
    const lauf = document.createElement("span");
    lauf.className = "laeuft-text";
    text(lauf, "läuft");
    kopf.insertBefore(lauf, zahl);
  }
  const spur = document.createElement("div");
  spur.className = laeuft ? "spur laeuft" : "spur";
  const fuell = document.createElement("span");
  fuell.className = "fuell";
  fuell.style.width = Math.max(0, Math.min(100, pct)) + "%";
  spur.append(fuell);
  block.append(kopf, spur);
  return block;
}

function balkenZeichnen(zeilen, arbeitet) {
  const ziel = document.getElementById("balken");
  ziel.replaceChildren();
  (zeilen || []).forEach(function (zeile) {
    const offen = Number(zeile.von) > Number(zeile.wert);
    ziel.append(anteil(zeile, !!arbeitet && offen));
  });
  if ((zeilen || []).length) {
    const legende = document.createElement("p");
    legende.className = "leer";
    text(legende, arbeitet
      ? "Der Lauf auf dem leeren Teil heißt: da wird gerade weiter gemessen."
      : "Der gefüllte Teil ist ausgewertet. Der leere Rest fehlt noch.");
    ziel.append(legende);
  }
}

function skala(werte) {
  return werte.reduce(function (groesste, wert) {
    return Math.max(groesste, Math.abs(Number(wert) || 0));
  }, 1) || 1;
}

function bewegungsBalken(wert, weit) {
  const spur = document.createElement("div");
  spur.className = "spur";
  const fuell = document.createElement("span");
  fuell.className = "fuell" + (wert < 0 ? " niedrig" : "");
  fuell.style.width = Math.max(4, Math.min(100, Math.abs(wert) / weit * 100)) + "%";
  spur.append(fuell);
  return spur;
}

function qualitaetName(name) {
  const namen = {
    zu_klein: "Datenbasis zu klein",
    vorsichtig: "Vorsichtig",
    belastbarer: "Belastbarer",
    index_fehlt: "Index fehlt",
    unbereinigt: "Nicht splitbereinigt",
    kein_vorsprung: "Kein Vorsprung"
  };
  return namen[name] || name;
}

function chip(name) {
  const span = document.createElement("span");
  text(span, name);
  return span;
}

function kurzstatus(stand) {
  return String(stand.status || "").split("\n").filter(function (zeile) {
    return zeile.indexOf("Gerade:") === 0 || zeile.indexOf("6 Stunden") !== -1;
  }).join("\n");
}

function karte(eintrag, weit) {
  const block = document.createElement("article");
  block.className = "karte";
  const kopf = document.createElement("div");
  kopf.className = "zeile";
  const name = document.createElement("div");
  name.className = "name";
  text(name, eintrag.name);
  const preis = document.createElement("div");
  preis.className = "preis";
  text(preis, eintrag.preis);
  const herkunft = document.createElement("span");
  herkunft.className = "herkunft";
  text(herkunft, eintrag.herkunft || "Quelle fehlt · Zeit fehlt");
  preis.append(herkunft);
  kopf.append(name, preis);
  const meta = document.createElement("div");
  meta.className = "meta";
  const symbol = document.createElement("span");
  symbol.className = "symbol";
  text(symbol, eintrag.symbol);
  const tag = document.createElement("span");
  tag.className = "tag " + (eintrag.richtung || "");
  text(tag, eintrag.tag);
  meta.append(symbol, tag);
  block.append(kopf, meta);
  const chips = document.createElement("div");
  chips.className = "chips";
  if (eintrag.fenster) chips.append(chip("Fenster"));
  if (eintrag.ungewoehnlich) chips.append(chip("Seltener Tag"));
  if (eintrag.markt) chips.append(chip("Mit dem Markt"));
  if (eintrag.qualitaet) chips.append(chip(qualitaetName(eintrag.qualitaet) + " · " + (eintrag.fenster_faelle || 0) + " Fälle"));
  if (chips.childElementCount) block.append(chips);
  if (typeof eintrag.tag_wert === "number") {
    const bewegung = document.createElement("div");
    bewegung.className = "bewegung";
    bewegung.append(bewegungsBalken(eintrag.tag_wert, weit || 1));
    const pct = document.createElement("strong");
    pct.className = eintrag.richtung || "";
    text(pct, eintrag.tag);
    bewegung.append(pct);
    block.append(bewegung);
  }
  if (eintrag.vorschlag) {
    const vorschlag = document.createElement("p");
    vorschlag.className = "vorschlag";
    text(vorschlag, eintrag.vorschlag);
    block.append(vorschlag);
  }
  if (eintrag.fenster) {
    const fenster = document.createElement("p");
    fenster.className = "fenster";
    text(fenster, eintrag.fenster);
    block.append(fenster);
  }
  if (eintrag.ungewoehnlich) {
    const tag = document.createElement("p");
    tag.className = "fenster";
    text(tag, eintrag.ungewoehnlich);
    block.append(tag);
  }
  if (eintrag.markt) {
    const marktSatz = document.createElement("p");
    marktSatz.className = "fenster";
    text(marktSatz, eintrag.markt);
    block.append(marktSatz);
  }
  const extra = document.createElement("p");
  extra.className = "extra";
  text(extra, eintrag.extra);
  block.append(extra);
  block.addEventListener("click", function () { block.classList.toggle("offen"); });
  return block;
}

function potenzialBlock(eintrag) {

let kiFilter = "alle";
let kiSort = "name";
let kiWahl = "";

  window._papier = papier;

  text(document.getElementById("papier-modus"), (papier.modus || "Simulation. Kein echtes Geld.") + " " + (papier.hinweis || "Paper-Handel ist aus."));

  hinweis.className = "regel breit";

  titel.className = "breit";

function kiListe(stand) {
  const liste = (stand.rangliste || []).filter(function (zeile) {
    if (kiFilter === "alle") return true;
    if (kiFilter === "aktiv") return zeile.einsatz;
    if (kiFilter === "pausiert") return !zeile.einsatz;
    if (kiFilter === "kurz" || kiFilter === "mittel" || kiFilter === "lang") return zeile.horizont === kiFilter;
    return zeile.gruppe === kiFilter;
  });
  liste.sort(function (a, b) {
    const links = a[kiSort];
    const rechts = b[kiSort];
    if (typeof links === "number" && typeof rechts === "number") return rechts - links;
    return String(links || "").localeCompare(String(rechts || ""), "de");
  });
  return liste;
}

  (detail.entscheidungen || []).slice(0, 3).forEach(function (entscheidung) {
    const zeileText = document.createElement("p");
    text(zeileText, (entscheidung.entscheidung || "") + " Signal " + (entscheidung.signal || "") + " " + (entscheidung.wahrscheinlichkeit || "ohne Wahrscheinlichkeit") + ". " + (entscheidung.grund || ""));

function kiMeta(stand) {

function euroWort(wert) {
  return String(wert || "0,00 €").replace("€", "Euro").replace(/^[+−-]\s*/, "").trim();
}

function ergebnisWort(klasse, wert) {
  const betrag = euroWort(wert);
  if (klasse === "plus") return "Plus " + betrag;
  if (klasse === "minus") return "Minus " + betrag;
  return "0 Euro";
}

    text(kurs, "Einkauf " + euroWort(eintrag.einstieg) + (eintrag.schutz ? ". " + eintrag.schutz : "") + (eintrag.stop ? ". Stop " + eintrag.stop : ""));

  (konto.orders || []).slice(0, 6).forEach(function (eintrag) {

async function papierSenden(inhalt) {
  const schalter = document.getElementById("papier-an");
  const stopp = document.getElementById("papier-stopp");
  schalter.disabled = true;
  stopp.disabled = true;
  text(document.getElementById("papier-modus"), "Simulation. Kein echtes Geld. Schaltet …");
  try {
    const antwort = await fetch("/papier", { method: "POST", headers: { "Content-Type": "application/json", "X-MarktRadar": "1" }, body: JSON.stringify(inhalt) });
    const daten = await antwort.json();
    if (!standJetzt) standJetzt = {};
    if (daten.papier) {
      standJetzt.papier = daten.papier;
      papierZeichnen(daten.papier);
    } else {
      text(document.getElementById("papier-modus"), "Simulation. Kein echtes Geld. " + (daten.meldung || "Hat nicht geklappt."));
    }
    zuletzt = "";
  } catch (fehler) {
    text(document.getElementById("papier-modus"), "Simulation. Kein echtes Geld. Die Schaltung hat den Server nicht erreicht.");
  }
  schalter.disabled = false;
  stopp.disabled = false;
}

function zeichnen(stand) {
  standJetzt = stand;
  text(brief, stand.briefing);
  text(statusText, kurzstatus(stand));
  balkenZeichnen(stand.bild, stand.arbeitet);
  text(document.getElementById("einschaetzung"), stand.einschaetzung || "");
  text(markt, stand.markt);
  text(uhr, stand.uhr);
  text(pille, stand.pille || "…");
  knopf.textContent = stand.arbeitet ? "Schaut …" : "Noch einmal schauen";
  knopf.disabled = !!stand.arbeitet;
  const offen = new Set(Array.from(karten.querySelectorAll(".karte.offen")).map(function (karte) {
    return karte.dataset.symbol;
  }));
  const stelle = karten.scrollTop;
  karten.replaceChildren();
  papierZeichnen(stand.papier || {});
  karten.append(gelerntBlock(stand), erklaerungBlock(stand), nachrichtenBlock(stand));
  const alle = stand.karten || [];
  const leiste = filterleiste(alle);
  const kartenliste = alle.filter(passt);
  if (!kartenliste.length) {
    const leer = document.createElement("p");
    leer.className = "leer";
    const wartet = stand.arbeitet && !alle.length;
    text(leer, stand.leer || (wartet ? "Die Kurse kommen." : "Noch nichts Ungewöhnliches."));
    karten.append(leiste, leer);
    return;
  }
  const raster = document.createElement("div");
  raster.className = "raster rang";
  const weit = skala(kartenliste.map(function (eintrag) { return eintrag.tag_wert; }));
  kartenliste.sort(function (a, b) {
    const links = typeof a.aufwaerts === "number" ? a.aufwaerts : -Infinity;
    const rechts = typeof b.aufwaerts === "number" ? b.aufwaerts : -Infinity;
    if (links !== rechts) return rechts - links;
    return String(a.name || "").localeCompare(String(b.name || ""), "de");
  });
  kartenliste.forEach(function (eintrag) {
    const block = karte(eintrag, weit);
    block.dataset.symbol = eintrag.symbol;
    if (offen.has(eintrag.symbol)) block.classList.add("offen");
    raster.append(block);
  });
  karten.append(
    leiste,
    nachObenBlock(kartenliste),
    namenBlock("KURZE FENSTER", kartenliste, "fenster", "Gerade kein geprüftes kurzes Fenster."),
    namenBlock("HEUTE UNGEWÖHNLICH", kartenliste, "ungewoehnlich", "Gerade kein Tag, der für den Namen selbst selten ist."),
    raster
  );
  karten.scrollTop = stelle;
}

function meldungsBlock(eintrag) {
  const block = document.createElement("article");
  block.className = "meldung";
  const titel = document.createElement("p");
  titel.className = "titel";
  text(titel, eintrag.titel);
  const meta = document.createElement("p");
  meta.className = "meta";
  text(meta, (eintrag.zeit || "") + " · " + (eintrag.quelle || "") + " · " + (eintrag.art || "Einordnung fehlt") + " · " + (eintrag.ton || "unklar") + " · " + (eintrag.quellenhinweis || ""));
  const grenze = document.createElement("p");
  grenze.className = "leer";
  text(grenze, "Der Kurs danach beweist die Ursache nicht.");
  block.append(titel, meta, grenze);
  const zahlen = (eintrag.symbole || []).map(function (symbol) { return symbol.zahl; }).filter(function (zahl) {
    return typeof zahl === "number";
  });
  const weit = skala(zahlen);
  (eintrag.symbole || []).forEach(function (symbol) {
    const zeile = document.createElement("div");
    zeile.className = "bewegung";
    const name = document.createElement("span");
    text(name, nameZu(symbol.symbol));
    zeile.append(name);
    if (typeof symbol.zahl === "number") {
      zeile.append(bewegungsBalken(symbol.zahl, weit));
      const pct = document.createElement("strong");
      pct.className = symbol.zahl < 0 ? "runter" : "hoch";
      text(pct, symbol.bewegung);
      zeile.append(pct);
    } else {
      const fehlt = document.createElement("span");
      text(fehlt, "Kursreaktion offen");
      zeile.append(fehlt);
    }
    block.append(zeile);
    if (symbol.relativ) {
      const relativ = document.createElement("p");
      relativ.className = "leer";
      text(relativ, symbol.relativ);
      block.append(relativ);
    }
    if (symbol.markt) {
      const hinweis = document.createElement("p");
      hinweis.className = "leer";
      text(hinweis, symbol.markt);
      block.append(hinweis);
    }
  });
  if (!(eintrag.symbole || []).length) {
    const leer = document.createElement("p");
    leer.className = "betroffen";
    text(leer, "Kein betroffener Name");
    block.append(leer);
  }
  return block;
}

function nameZu(symbol) {
  const karte = (standJetzt && standJetzt.karten || []).find(function (eintrag) { return eintrag.symbol === symbol; });
  return karte ? karte.name : symbol;
}

function filterleiste(alle) {
  const leiste = document.createElement("div");
  leiste.className = "leiste";
  ["Alle"].concat(BEREICHE).forEach(function (name) {
    const liste = name === "Alle" ? alle : alle.filter(function (eintrag) { return eintrag.bereich === name; });
    if (name !== "Alle" && !liste.length) return;
    const knopfAbt = document.createElement("button");
    knopfAbt.type = "button";
    knopfAbt.className = "abt" + (bereichFilter === name ? " aktiv" : "");
    text(knopfAbt, name);
    const zahl = document.createElement("strong");
    text(zahl, String(liste.length));
    knopfAbt.append(zahl);
    knopfAbt.addEventListener("click", function () {
      bereichFilter = name;
      if (standJetzt) zeichnen(standJetzt);
    });
    leiste.append(knopfAbt);
  });
  return leiste;
}

async function laden() {
  try {
    const antwort = await fetch("/stand");
    if (!antwort.ok) return;
    const roh = await antwort.text();
    if (roh === zuletzt) return;
    zuletzt = roh;
    zeichnen(JSON.parse(roh));
  } catch (fehler) {}
}

document.getElementById("papier-zeigen").addEventListener("click", function () {
  const an = !document.body.classList.contains("alpaka");
  document.body.classList.toggle("alpaka", an);
  text(this, an ? "Zurück zu den Aktien" : "Alpaka");
});
document.getElementById("papier-an").addEventListener("click", function () {
  const an = !(standJetzt && standJetzt.papier && standJetzt.papier.automatisch);
  papierSenden({ automatisch: an, bestaetigung: an ? "PAPIER" : "", notfall: false });
});
document.getElementById("papier-stopp").addEventListener("click", function () {
  papierSenden({ automatisch: false, bestaetigung: "", notfall: true });
});

knopf.addEventListener("click", async function () {
  knopf.disabled = true;
  knopf.textContent = "Schaut …";
  zuletzt = "";
  try { await fetch("/neu"); } catch (fehler) {}
});

const sucheFeld = document.getElementById("suche");
const treffer = document.getElementById("treffer");
sucheFeld.addEventListener("input", function () {
  suche = sucheFeld.value.trim().toLowerCase();
  zuletzt = "";
  if (standJetzt) zeichnen(standJetzt);
});
document.getElementById("finden").addEventListener("click", async function () {
  treffer.replaceChildren();
  const antwort = await fetch("/suche?q=" + encodeURIComponent(sucheFeld.value.trim()));
  const daten = await antwort.json();
  if (!daten.treffer || !daten.treffer.length) {
    const hinweis = document.createElement("p");
    hinweis.className = "extra";
    hinweis.style.display = "block";
    text(hinweis, daten.meldung || "Nichts gefunden.");
    treffer.append(hinweis);
    return;
  }
  daten.treffer.forEach(function (eintrag) {
    const knopf = document.createElement("button");
    knopf.type = "button";
    knopf.textContent = eintrag.symbol + " · " + eintrag.name;
    knopf.addEventListener("click", async function () {
      await fetch("/liste", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ symbol: eintrag.symbol }) });
      knopf.disabled = true;
      knopf.textContent = eintrag.symbol + " ist auf der Liste";
    });
    treffer.append(knopf);
  });
});

const verlauf = document.getElementById("verlauf");
const schluessel = "marktradar-chat";

function blase(rolle, inhalt) {
  const satz = document.createElement("p");
  satz.className = "blase " + rolle;
  text(satz, inhalt);
  verlauf.append(satz);
  verlauf.scrollTop = verlauf.scrollHeight;
}

function merken(rolle, inhalt) {
  blase(rolle, inhalt);
  const alle = JSON.parse(localStorage.getItem(schluessel) || "[]");
  alle.push({ rolle: rolle, inhalt: inhalt });
  localStorage.setItem(schluessel, JSON.stringify(alle.slice(-40)));
}

JSON.parse(localStorage.getItem(schluessel) || "[]").forEach(function (eintrag) {
  blase(eintrag.rolle, eintrag.inhalt);
});
if (!verlauf.childElementCount) {
  blase("sie", "Hey. Ich bin da. Frag mich nach einem Namen, oder sag einfach Hallo.");
}

document.getElementById("frage").addEventListener("submit", async function (ereignis) {
  ereignis.preventDefault();
  const feld = document.getElementById("satz");
  const satz = feld.value.trim();
  if (!satz) return;
  feld.value = "";
  merken("ich", satz);
  try {
    const antwort = await fetch("/frage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: satz })
    });
    const daten = await antwort.json();
    merken("sie", daten.antwort || "Ich habe gerade keine Antwort.");
  } catch (fehler) {
    merken("sie", "Die Verbindung zum Fenster ist gerade weg.");
  }
});

laden();
setInterval(laden, 1000);
</script>
